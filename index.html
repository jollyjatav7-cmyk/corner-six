<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="角球六要素">
<meta name="theme-color" content="#2F6C4B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>角球六要素</title>
<style>
:root{
  --paper:#F1F3EF; --card:#FFFFFF; --raise:#F5F7F4; --ink:#14201A; --ink2:#46544C; --muted:#748178; --rule:#D3DAD4; --line2:#E3E7E2;
  --grass:#2F6C4B; --pitch:#24573D; --pitch2:#1F4D35; --chalk:#F3F5EE; --chalk2:rgba(243,245,238,.66); --tile:rgba(255,255,255,.08); --tile2:rgba(255,255,255,.16);
  --flag:#F2C230; --on-flag:#2A2100; --home:#2A58D3; --away:#CF4229; --warn:#B3261E; --ok:#2F8A57; --scrim:rgba(8,14,10,.45);
  --l1:#E4ECE6; --l2:#C6DCCD; --l3:#93BFA2; --l4:#4E9168; --l5:#24573D; --on-l:#14201A; --on-l4:#FFFFFF;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-num:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",-apple-system,sans-serif;
  --pipH:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101613; --card:#18201C; --raise:#1C2520; --ink:#E4EAE5; --ink2:#AFBAB3; --muted:#7F8C85; --rule:#2B3530; --line2:#28322D;
  --grass:#2B6445; --pitch:#1E4A33; --pitch2:#1A422D; --home:#86A9FF; --away:#FF8E72; --warn:#FF6B5E; --ok:#5CC08A; --scrim:rgba(0,0,0,.6);
  --l1:#26302B; --l2:#2F4A3A; --l3:#3D6B50; --l4:#4E9168; --l5:#7CC496; --on-l:#E4EAE5; --on-l4:#0E1611;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
input,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 比分列 ---------- */
.app{min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:10px 20px 8px}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta input{border:0;background:none;padding:0;font-weight:600;font-size:15px;min-width:0;width:100%}
.meta input::placeholder{color:var(--muted)}
.meta .sub{font-size:12px;color:var(--muted)}
.score{display:grid;grid-template-columns:minmax(0,9em) auto auto auto minmax(0,9em);align-items:center;gap:10px}
.tn{display:flex;flex-direction:column;min-width:0}
.tn.h{align-items:flex-end;text-align:right} .tn.a{align-items:flex-start}
.tn input{border:0;background:none;padding:0;font-weight:700;font-size:17px;width:100%;text-overflow:ellipsis}
.tn.h input{text-align:right;color:var(--home)} .tn.a input{color:var(--away)}
.tn input::placeholder{color:inherit;opacity:.55}
.cks{border:0;background:none;padding:3px 0;font-size:12px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.gl{border:0;background:none;padding:0 3px;border-radius:8px;font:600 40px/1 var(--f-num);min-width:.7em;text-align:center}
.gl.h{color:var(--home)} .gl.a{color:var(--away)}
.gl:active,.cks:active{background:var(--rule)}
.clk{display:flex;align-items:center;gap:8px}
.clkbtn{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.clkbtn span{font-size:12px;color:var(--muted);line-height:1}
.clkbtn b{font:600 34px/1.05 var(--f-num);font-variant-numeric:tabular-nums}
.clk.idle .clkbtn b{color:var(--muted)}
.run{width:40px;height:40px;border-radius:20px;border:0;background:var(--grass);color:var(--chalk);display:grid;place-items:center}
.run.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.run svg{width:16px;height:16px}
.bar .tools{justify-self:end;display:flex;gap:6px;align-items:center}
.tbtn{height:36px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink2);font-weight:500;white-space:nowrap}
.tbtn:active{background:var(--rule)}
.tbtn.ic{width:40px;padding:0;display:grid;place-items:center}

/* ---------- 主区：iPad 三栏 ---------- */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px) minmax(0,1fr);grid-template-areas:"home mid away";gap:14px;padding:6px 20px 76px;align-items:start}
.pad[data-i="0"]{grid-area:home} .pad[data-i="1"]{grid-area:away} .mid{grid-area:mid}
.pad{min-width:0}
.pad-h{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;font-size:14px}
.pad-h i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pad[data-i="0"] .pad-h i{background:var(--home)} .pad[data-i="1"] .pad-h i{background:var(--away)}
.pad-h b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad[data-i="0"] .pad-h b{color:var(--home)} .pad[data-i="1"] .pad-h b{color:var(--away)}
.pad-h .sp{flex:1}
.pad-h .tot{font-size:12px;color:var(--muted);white-space:nowrap}
.undo{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis}
.undo.hot{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.undo:disabled{opacity:.35}
.board{background:var(--pitch);color:var(--chalk);border-radius:18px;padding:10px;display:grid;gap:6px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.k{position:relative;border:0;border-radius:12px;background:var(--tile);color:var(--chalk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:6px 4px;min-height:52px}
.k:active{background:var(--tile2)}
.k .l{font-size:14px;font-weight:600;line-height:1.15;text-align:center;white-space:nowrap}
.k .c{font:600 18px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--chalk2)}
.k.big{min-height:64px;flex-direction:row;gap:10px}
.k.big .l{font-size:17px}
.k.big .c{font-size:26px}
.k.ckb{background:var(--flag);color:var(--on-flag)} .k.ckb .c{color:var(--on-flag);opacity:.75}
.k.ckb:active{filter:brightness(.92)}
.k.goal{box-shadow:inset 0 0 0 1.5px var(--chalk2)}
.k.hit{animation:hit .45s ease-out}
@keyframes hit{0%{background:rgba(243,245,238,.6)}100%{background:var(--tile)}}
.k.ckb.hit{animation:hitf .45s ease-out}
@keyframes hitf{0%{filter:brightness(1.25)}100%{filter:none}}
@media (prefers-reduced-motion:reduce){.k.hit,.k.ckb.hit{animation:none}}
.row5{display:grid;grid-template-columns:4.6em repeat(5,minmax(0,1fr));gap:5px;align-items:stretch}
.row5.two{grid-template-columns:4.6em repeat(2,minmax(0,1fr))}
.rl{display:flex;flex-direction:column;justify-content:center;padding:0 2px 0 4px;min-width:0}
.rl b{font-size:13px;font-weight:700;line-height:1.15}
.rl span{font:600 17px/1.1 var(--f-num);color:var(--chalk2)}
.row5 .k{min-height:50px}
.row5 .k .l{font-size:13.5px}
.row5 .k .c{font-size:15px}
.minor{display:flex;justify-content:center;gap:8px;padding-top:2px}
.minor .k{flex:0 1 auto;flex-direction:row;gap:6px;min-height:34px;padding:4px 14px;border-radius:17px;background:transparent;box-shadow:inset 0 0 0 1px rgba(243,245,238,.35)}
.minor .k .l{font-size:12.5px;font-weight:500}
.minor .k .c{font-size:14px}
.sep{height:1px;background:rgba(243,245,238,.18);margin:2px 0}
/* 手机：动作按键＋结果选单 */
.acts{position:relative;display:grid;gap:6px}
.ov{position:absolute;left:0;right:0;top:0;bottom:0;z-index:3;background:var(--pitch2);border-radius:12px;display:flex;flex-direction:column;gap:5px;padding:0}
.ov[hidden]{display:none}
.ov-h{display:flex;align-items:center;gap:6px;padding:2px 2px 0 6px;min-height:30px}
.ov-h b{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov-h button{border:0;background:none;color:var(--chalk2);font-size:12.5px;height:30px;padding:0 6px;white-space:nowrap}
.ov-t{height:3px;border-radius:2px;background:var(--tile2);margin:0 6px;overflow:hidden}
.ov-t i{display:block;height:100%;background:var(--flag);width:100%;transform-origin:left center}
.ov-b{flex:1;display:grid;gap:5px;grid-auto-rows:minmax(0,1fr)}
.ov-b .k{min-height:0}
.ov-b .k .l{font-size:16px}

/* ---------- 中间卡片 ---------- */
.mid{min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--paper);border-radius:11px;padding:3px;flex:none}
.tabs button{height:32px;border:0;border-radius:9px;background:none;font-size:13px;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:700;color:var(--ink)}
.mid[data-tab="six"] .tabp:not([data-tab="six"]),.mid[data-tab="data"] .tabp:not([data-tab="data"]),.mid[data-tab="ck"] .tabp:not([data-tab="ck"]){display:none}
.mid-top{display:none}
.tabp{display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:2px;box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{border:0;background:none;height:30px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.shead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shead .sp{flex:1}
.basel{border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.six{width:100%;border-collapse:collapse;table-layout:fixed}
.six th{font-size:12px;font-weight:700;padding:0 0 6px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.six th.h{color:var(--home)} .six th.a{color:var(--away)}
.six th.fn,.six td.fn{width:5.2em}
.six td{border-top:1px solid var(--rule);padding:7px 4px 7px 0;vertical-align:top}
.six td.fn{font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.25;padding-right:6px}
.six td.fn small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.cell{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;color:var(--ink);min-width:0}
.cell:active{opacity:.7}
.lv{display:flex;align-items:center;gap:6px;min-width:0}
.lv em{font-style:normal;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bd{flex:none;min-width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;font:700 15px/1 var(--f-num);background:var(--l1);color:var(--on-l)}
.bd.v1{background:var(--l1)} .bd.v2{background:var(--l2)} .bd.v3{background:var(--l3)} .bd.v4{background:var(--l4);color:var(--on-l4)} .bd.v5{background:var(--l5);color:var(--on-l4)}
.bd.na{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--muted);font-size:13px}
.bd.man{box-shadow:0 0 0 2px var(--flag)}
.mt{font-size:11.5px;color:var(--muted);line-height:1.35}
.mt b{font:600 13px var(--f-num);color:var(--ink2)}
.f2b{display:flex;gap:3px;flex-wrap:wrap}
.f2b span{font-size:11px;color:var(--ink2);background:var(--paper);border-radius:6px;padding:1px 5px;white-space:nowrap}
.f2b span b{font:700 12px var(--f-num);margin-left:2px}
.f2b span.top{background:var(--l4);color:var(--on-l4)}
.cmb{font-size:12px;color:var(--ink2);font-weight:600;line-height:1.35}
.cmb small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.ckv{font:600 26px/1 var(--f-num)}
.ckv small{font:500 12px var(--f-ui);color:var(--muted);margin-left:4px}
.proj{font-size:12px;color:var(--ink2);line-height:1.4}
.proj b{font:700 15px var(--f-num);color:var(--ink)}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin:0}
.dt{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.dt th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;padding:2px 0 6px}
.dt th:first-child{text-align:left;width:38%}
.dt th.h{color:var(--home)} .dt th.a{color:var(--away)}
.dt td{border-top:1px solid var(--rule);padding:6px 0;text-align:right;font:600 15px var(--f-num);font-variant-numeric:tabular-nums}
.dt td:first-child{text-align:left;font:600 13px var(--f-ui);color:var(--ink2)}
.dt td small{font:500 11px var(--f-ui);color:var(--muted);margin-left:2px}
.dt tr.sub td:first-child{font-weight:500;color:var(--muted);padding-left:12px}
.dt tr.sub td{font-size:14px;color:var(--ink2)}
.srcl{display:grid;gap:4px}
.srcr{display:grid;grid-template-columns:minmax(0,1fr) 2.2em;gap:8px;font-size:13px;align-items:baseline}
.srcr b{font:700 15px var(--f-num);text-align:right}
.srcr span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cki{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cki h4{margin:0 0 6px;font-size:13px}
.cki h4.h{color:var(--home)} .cki h4.a{color:var(--away)}
@media (min-width:900px){
  .main{align-items:stretch}
  .main .mid{max-height:calc(100vh - 150px);overflow:auto;overscroll-behavior:contain;position:sticky;top:8px;align-self:start}
}
@media (min-width:900px) and (max-width:1150px){.pad-h .tot{display:none}}
@media (min-width:900px) and (max-height:860px){
  .bar{padding:6px 20px 4px}
  .board{padding:8px;gap:5px}
  .k{min-height:46px} .row5 .k{min-height:44px} .k.big{min-height:54px}
}
@media (max-width:899px){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"home away" "mid mid";gap:10px;padding:6px 12px 80px}
  .bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"meta tools" "score score";padding:8px 12px 6px;row-gap:4px}
  .bar .meta{grid-area:meta;flex-direction:row;align-items:baseline;gap:10px}
  .bar .meta input{width:auto;flex:1}
  .bar .tools{grid-area:tools}
  .score{grid-area:score;justify-self:stretch;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr)}
}

/* ---------- 底部快捷栏 ---------- */
.strip{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--raise);border-top:1px solid var(--rule);
  padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.recent{flex:1;min-width:0;display:flex;gap:14px;overflow:hidden;font-size:13px;white-space:nowrap;color:var(--ink2)}
.recent button{border:0;background:none;padding:4px 0;display:flex;gap:6px;align-items:baseline;color:var(--ink2)}
.recent .t{font:600 14px var(--f-num);color:var(--muted)}
.recent .d0{color:var(--home)} .recent .d1{color:var(--away)}
.recent .empty{color:var(--muted)}
.qb{border:0;height:38px;padding:0 12px;border-radius:19px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink)}
.qb:active{background:var(--rule)}
.qb svg{width:18px;height:18px;flex:none}
.qb small{font-size:11px;font-weight:500;color:var(--muted)}
.qb:disabled{opacity:.4}
.qb.only-phone{display:none}

/* ---------- 弹出视窗 ---------- */
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.card{width:100%;max-width:560px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card.wide{max-width:740px}
@media (min-width:700px){.sheet{align-items:center}.card{border-radius:18px}}
.card-h{display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:17px;flex:1;min-width:0}
.pill{height:38px;padding:0 14px;border:0;border-radius:19px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-weight:600;white-space:nowrap}
.pill:active{background:var(--rule)}
.pill.dark{background:var(--ink);color:var(--paper);box-shadow:none}
.pill.green{background:var(--grass);color:var(--chalk);box-shadow:none}
.pill.danger{background:var(--warn);color:#fff;box-shadow:none}
.pill:disabled{opacity:.45}
.pill.bigp{height:46px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.chip:disabled{opacity:.4}
.lbl{font-size:12.5px;color:var(--muted);margin-bottom:-6px}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.55}
.netnote{margin:0;font-size:13px;line-height:1.5;color:var(--ink2);background:var(--paper);border-radius:10px;padding:8px 10px}
.big-clk{font:600 54px/1 var(--f-num);font-variant-numeric:tabular-nums;text-align:center}
.tp{display:grid;gap:8px}
.tpv{font:600 44px/1 var(--f-num);font-variant-numeric:tabular-nums;text-align:center}
.tpr{-webkit-appearance:none;appearance:none;width:100%;height:36px;margin:0;background:transparent;touch-action:pan-y}
.tpr::-webkit-slider-runnable-track{height:6px;border-radius:3px;background:var(--rule)}
.tpr::-webkit-slider-thumb{-webkit-appearance:none;width:30px;height:30px;border-radius:50%;background:var(--grass);margin-top:-12px;box-shadow:0 1px 4px rgba(0,0,0,.25)}
.tps{position:relative;height:14px;margin:-6px 15px 0;font-size:11px;color:var(--muted)}
.tps span{position:absolute;-webkit-transform:translateX(-50%);transform:translateX(-50%);white-space:nowrap}
.tpb{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
@media (max-width:560px){.tpb{display:grid;grid-template-columns:repeat(3,1fr)}}
.stp{display:grid;grid-template-columns:1fr 38px 2.6em 38px;align-items:center;gap:6px;font-size:14px}
.stp span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.stp .h{color:var(--home)} .stp .a{color:var(--away)}
.stp button{height:38px;border:0;border-radius:19px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-size:18px;font-weight:600}
.stp b{text-align:center;font:600 20px var(--f-num)}
.jgrp{display:grid;gap:6px}

  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"home away";grid-template-rows:minmax(0,1fr);align-items:stretch;gap:8px;padding:6px 10px calc(60px + env(safe-area-inset-bottom))}

/* 统计：只用整个半场都有看到的（检验等级跟角球的关系时） */
function whStats(){

    + lgs.map(k => { const x = lg[k]; return '<tr><td class="tl">' + esc(k) + '</td><td>' + x.n + '</td><td>' + (x.g / x.n).toFixed(1) + '</td><td>' + (x.nf ? (x.cf / x.nf).toFixed(1) : '—') + '</td><td>' + (x.n1 ? (x.c1 / x.n1).toFixed(1) : '—') + '</td></tr>'; }).join('')

    + '</tbody></table><p class="hint">全场角球只算看到最后的比赛（包括补录的角球）。公开数据：每场 ' + (BASE.match.vol.corners * 2).toFixed(1) + ' 个角球、' + (BASE.match.vol.goals * 2).toFixed(1) + ' 个进球。</p></div>';
  // 我的六项平均（合并计算）对比公开数据
  const S = {}, add = (c, co, mins) => { const P = parts(c, co, mins); for (const k of ['f3', 'f4', 'f5', 'f6']){ S[k] = S[k] || [0, 0]; S[k][0] += P[k][0]; S[k][1] += P[k][1]; } S.ar = (S.ar || 0) + P.ar; S.mins = (S.mins || 0) + mins; S.ck = (S.ck || 0) + (c.ck || 0); S.n = (S.n || 0) + 1;
    for (const a of ACTS) S[a] = (S[a] || 0) + P.g[a]; };

    const pb = BASE.half.pooled, rr = (k) => S[k][1] ? S[k][0] / S[k][1] : null;

    h += '<div><h4>我的六项平均（' + halves.length + ' 个完整半场）</h4><table class="sts"><thead><tr><th>项目</th><th>我的记录</th><th>公开数据</th></tr></thead><tbody>'
      + rows.map(x => '<tr><td class="tl">' + x[0] + '</td><td>' + x[3](x[1]) + '</td><td class="dim">' + x[3](x[2]) + '</td></tr>').join('') + '</tbody></table>'
      + '<p class="hint">跟公开数据差很多的项目，多半是你点的习惯跟数据的定义不太一样（例如“到达”点得比较严）。记满 10 场整场后，可以在“对比基准”改成用你自己的记录。</p></div>';
    // 每一项不同等级的平均角球（检验逻辑）
    const tab = (key, title) => {
      const g = {}; for (const r of halves){ const v = r[key]; if (!v) continue; const x = g[v] || (g[v] = [0, 0]); x[0] += r.ck; x[1]++; }
      return '<tr><td class="tl">' + title + '</td>' + [1, 2, 3, 4, 5].map(v => g[v] ? '<td>' + (g[v][0] / g[v][1]).toFixed(1) + '<small>' + g[v][1] + '</small></td>' : '<td class="dim">—</td>').join('') + '</tr>';
    };

    h += '<div><h4>每个等级的平均角球（每队每半场）</h4><table class="sts"><thead><tr><th>项目</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody>'
      + tab('f1', '① 到达') + tab('f5', '⑤ 心态') + tab('f4', '④ 禁区外空间') + tab('f3', '③ 禁区内空间') + tab('f6', '⑥ 质量') + '</tbody></table>'
      + '<table class="sts" style="margin-top:8px"><thead><tr><th>② 行动选择</th>' + ['d', 'e', 'p', 'l', 'b'].map(c => '<th>' + F2CAT[c][1] + '</th>').join('') + '</tr></thead><tbody><tr><td class="tl">平均角球</td>'
      + ['d', 'e', 'p', 'l', 'b'].map(c => cat[c] ? '<td>' + (cat[c][0] / cat[c][1]).toFixed(1) + '<small>' + cat[c][1] + '</small></td>' : '<td class="dim">—</td>').join('') + '</tr></tbody></table>'
      + '<p class="hint">小字是半场数。等级用公开数据的五等分算（自动等级）。公开数据里，每队每半场平均 ' + f1(BASE.half.vol.corners) + ' 个；①到达 1→5 级大约从 1.2 个到 4.1 个，⑤心态从 1.6 个到 3.3 个。每格少于 10 个半场时，数字还会跳得很厉害。</p></div>';
    // 手动评级的同样统计
    const manTab = k => { const g = {}; for (const r of halves){ const v = r.man[k]; if (!v || k === 'f2') continue; const x = g[v] || (g[v] = [0, 0]); x[0] += r.ck; x[1]++; } return g; };

    if (anyMan){
      h += '<div><h4>按你的手动评级</h4><table class="sts"><thead><tr><th>项目</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody>'
        + FK.map((k, j) => { const g = manTab(k); if (!Object.keys(g).length) return ''; return '<tr><td class="tl">' + ['①', '②', '③', '④', '⑤', '⑥'][j] + ' ' + FN[j] + '</td>' + [1, 2, 3, 4, 5].map(v => g[v] ? '<td>' + (g[v][0] / g[v][1]).toFixed(1) + '<small>' + g[v][1] + '</small></td>' : '<td class="dim">—</td>').join('') + '</tr>'; }).join('')
        + '</tbody></table></div>';
    }
    // 心态 × 禁区外空间

function sixLevelsPub(c, co, mins){
  const P = parts(c, co, mins), b = BASE.half;
  const r = {};
  r.f1 = P.mins >= 8 ? lvlOf((P.ar + b.f1_rate.m * 0.5) / (P.mins + 5) * 10, b.f1_rate.q) : null;
  r.f3 = P.f3[1] >= 3 ? lvlOf(shrink(P.f3, b.f3_space.m, 3), b.f3_space.q) : null;
  r.f4 = P.f4[1] >= 3 ? lvlOf(shrink(P.f4, b.f4_block.m, 3), b.f4_block.q, true) : null;
  r.f5 = P.ar >= 3 ? lvlOf(shrink(P.f5, b.f5_aggr.m, 3), b.f5_aggr.q) : null;
  r.f6 = P.f6[1] >= 3 ? lvlOf(shrink(P.f6, b.f6_err.m, 3), b.f6_err.q, true) : null;
  r.f2 = null;
  if (P.ar >= 3){
    let top = null, best = 0;
    for (const x of [['d', 'f2_dcross'], ['e', 'f2_ecross'], ['p', 'f2_pen'], ['l', 'f2_lshot']]){ const rel = shrink([P.g[x[0]], P.ar], b[x[1]].m, 2) / b[x[1]].m; if (rel >= 1.2 && rel > best){ best = rel; top = x[0]; } }
    r.f2 = top || 'b';
  }
  return r;
}

const README = '角球六要素导出档（fmt=1）。matches 是比赛阵列，每场：id、d 日期、lg 联赛、h 主队、a 客队、st 状态(1进行中/2已结束)、keep(1=结束时选了加入仓库)、pe 各半场结束时的比赛时钟秒数、obs 开始记录的位置{p 半场, t 比赛时钟秒数}、stop 结束记录的位置、man 手动评级{队伍0/1:{h1/h2/ft:{f1..f6: 1-5}}}、note 备注、ev 事件阵列。'
  + '每个事件 = [t 比赛时钟秒数（下半场从2700起算）, p 半场(1/2), i 队伍(0主队/1客队), c 代码, b(可省略；1=补录、时间不详)]。只有 obs 到 stop 之间是实际看到的。'
  + '代码：ar 到达（本队在对方禁区附近控制住球，同一次进攻只算一次）；动作 d 下底传中（禁区线以内的边路）、e 45度传中（禁区线以外的边路）、p 突破渗透、l 远射、s 禁区射门；第二个字母是结果：传中 b被挡(传出后约10米内) c解围 g门将 o到人 x失误(出界/越位/没人碰)，突破 o成功 l被断，射门 b被挡 p扑出(没抱住) h没收(抱住) x射偏 z进球；只有一个字母=结果没记。ck 角球、og 对方乌龙(本队得分)、gx 其他进球(点球、任意球直接进)、rc 红牌。'
  + '六项：①到达=每10分钟到达次数；②行动选择=每次到达的 d/e/p/l 次数；③禁区内空间=(do+eo+没被挡的s)/(do+eo+dc+ec+dg+eg+全部有结果的s)；④禁区外空间=(db+eb+lb+pl)/(有结果的d+e+l+p)，越高空间越小；⑤心态=(d+e+l+s)/到达；⑥质量=(dx+ex+lx+sx+lh+sh)/没被挡的传射，越高质量越差。base 是公开数据的平均和五等分（StatsBomb Open Data 2015/16）。';
function codesObj(){ const o = {}; for (const c of ALLCODES) o[c] = label(c); return o; }
function openExport(list){
  const ds = new Date().toISOString().slice(0, 10);
  const matches = list.map(m => ({ id: m.id, d: m.d, lg: m.lg, h: m.h, a: m.a, st: m.st, keep: m.keep ? 1 : undefined, pe: m.pe, obs: m.obs, stop: m.stop, man: m.man, note: m.note || undefined,
    ev: m.ev.map(e => e.b ? [e.t, e.p, e.i, e.c, 1] : [e.t, e.p, e.i, e.c]) }));
  const obj = { app: '角球六要素', fmt: 1, ver: APPVER, exported: new Date().toISOString().slice(0, 16), readme: README, codes: codesObj(),
    base: { src: BASE.src, half: { f1_rate: BASE.half.f1_rate, f3_space: BASE.half.f3_space, f4_block: BASE.half.f4_block, f5_aggr: BASE.half.f5_aggr, f6_err: BASE.half.f6_err }, yield: BASE.yield }, matches: matches };
  const nm = s => (s || '').replace(/[\\/:*?"<>|\s]+/g, '');
  const name = list.length === 1 ? '角球六要素_' + list[0].d + '_' + (nm(list[0].h) || '主队') + 'vs' + (nm(list[0].a) || '客队') + '.json' : '角球六要素_全部' + list.length + '场_' + ds + '.json';
  openSheet('export', { text: JSON.stringify(obj), name: name, count: list.length, type: 'application/json' });
}
function openCsv(list){
  const head = ['日期', '联赛', '主队', '客队', '球队', '主客', '半场', '看到分钟', '完整半场', '到达', '下底传中', '45度传中', '突破渗透', '远射', '禁区射门'];
  for (const a of ACTS) for (const o of ACT[a].o) head.push(ACT[a].s + OUT[a][o]);
  head.push('角球', '进球', '动作折算', '①到达等级', '②行动选择', '③禁区内等级', '④禁区外等级', '⑤心态等级', '⑥质量等级', '①手动', '②手动', '③手动', '④手动', '⑤手动', '⑥手动', '备注');
  const rows = [head];
  for (const m of list){
    for (const p of [1, 2]){
      if (!halfSpan(m, p)) continue;
      for (const i of [0, 1]){
        const sc = 'h' + p, c = tally(m, i, sc), ca = tally(m, i, sc, true), g = groups(c), mins = minsOf(m, sc);
        const savedM = M; M = m; const r = sixOf(m, i, sc); M = savedM;
        const man = (m.man[i] && m.man[i][sc]) || {};
        const row = [m.d, m.lg, m.h, m.a, i ? m.a : m.h, i ? '客' : '主', p === 1 ? '上' : '下', mins.toFixed(1), fullHalf(m, p) ? 1 : 0, g.ar, g.d, g.e, g.p, g.l, g.s];
        for (const a of ACTS) for (const o of ACT[a].o) row.push(c[a + o] || 0);
        let goals = 0; for (const k of GOALC) goals += ca[k] || 0;
        row.push(ca.ck || 0, goals, r.xc.toFixed(2), r.lv.f1 || '', f2Text(r), r.lv.f3 || '', r.lv.f4 || '', r.lv.f5 || '', r.lv.f6 || '');
        for (const k of FK) row.push(k === 'f2' ? (F2CAT[man[k]] ? F2CAT[man[k]][0] : '') : (man[k] || ''));
        row.push(p === 1 && i === 0 ? m.note : '');
        rows.push(row);
      }
    }
  }
  const csv = '﻿' + rows.map(r => r.map(v => { const s = String(v == null ? '' : v); return /[",\n]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s; }).join(',')).join('\n');
  openSheet('export', { text: csv, name: '角球六要素_' + list.length + '场_' + new Date().toISOString().slice(0, 10) + '.csv', count: list.length, type: 'text/csv' });
}

function importText(txt){
  let o;
  try { o = JSON.parse(txt); } catch (e){ showToast('读不懂这段文字，请确认是完整的导出内容'); return; }
  if (!o || o.fmt !== 1 || o.app !== '角球六要素' || !Array.isArray(o.matches)){ showToast('这不是角球六要素的导出档'); return; }
  let n = 0;
  for (const r of o.matches){
    if (!r || !r.id || r.id === M.id) continue;
    const m = fixMatch({ id: String(r.id), c: nowSec(), u: nowSec(), d: r.d, lg: r.lg, h: r.h, a: r.a, st: r.st, keep: r.keep, pe: r.pe, obs: r.obs, stop: r.stop, man: r.man, note: r.note,
      tm: null, ev: (r.ev || []).map(x => ({ t: x[0], p: x[1], i: x[2], c: x[3], b: x[4] })) });
    const last = m.ev[m.ev.length - 1];
    m.tm = m.stop ? { p: m.stop.p, b: m.stop.t, r: 0, at: 0, ht: 0 } : { p: last ? last.p : 1, b: last ? last.t : 0, r: 0, at: 0, ht: 0 };
    store[m.id] = m; n++;
  }
  LS.set(KEY, store); closeSheet(); renderAll();
  showToast('已导入 ' + n + ' 场');
}

/* 补录：按差额加减补录事件（b=1）；减少时先减补录的，再减最后点的 */
function applyFix(d){
  const adj = (i, code, p, want, have) => {
    let diff = want - have;
    while (diff > 0){ M.ev.push({ t: PER[p][0], p: p, i: i, c: code, b: 1, k: ++seq }); diff--; }
    while (diff < 0){
      let pick = null;
      for (const e of M.ev) if (e.i === i && e.c === code && (p == null || e.p === p) && e.b && (!pick || e.k > pick.k)) pick = e;
      if (!pick) for (const e of M.ev) if (e.i === i && e.c === code && (p == null || e.p === p) && (!pick || e.k > pick.k)) pick = e;
      if (!pick) break;
      M.ev.splice(M.ev.indexOf(pick), 1); diff++;
    }
  };
  const o = d.orig;
  for (const i of [0, 1]){
    adj(i, 'ck', 1, d.c1[i], o.c1[i]);
    if (d.c2) adj(i, 'ck', 2, d.c2[i], o.c2[i]);
    const p = curP();
    adj(i, 'og', p, d.og[i], o.og[i]);
    adj(i, 'rc', p, d.rc[i], o.rc[i]);
    // 比分里不是乌龙的部分：用“其他进球”补
    const otherWant = d.sc[i] - d.og[i], otherHave = o.sc[i] - o.og[i];
    if (otherWant !== otherHave){
      let diff = otherWant - otherHave;
      while (diff > 0){ M.ev.push({ t: PER[p][0], p: p, i: i, c: 'gx', b: 1, k: ++seq }); diff--; }
      while (diff < 0){
        let pick = null;
        for (const code of ['gx', 'sz', 'lz']){ for (const e of M.ev) if (e.i === i && e.c === code && (!pick || e.k > pick.k)) pick = e; if (pick) break; }
        if (!pick) break;
        if (pick.c === 'gx') M.ev.splice(M.ev.indexOf(pick), 1); else pick.c = pick.c[0] + 'p';
        diff++;
      }
    }
  }
  sortEv(M); save();
}

  else { if (!M.tm.b && M.tm.p === 1 && !M.ev.some(e => !e.b)) { kick(1); showToast('上半场开球，计时开始'); } else startClock(); if (M.st === 2){ M.st = 1; M.stop = null; } }
  save(); renderAll();
});
for (const [id, key] of [['#fH', 'h'], ['#fA', 'a'], ['#fLg', 'lg']]){
  const el = $(id);
  el.addEventListener('input', () => { M[key] = el.value; save(); renderPads(); renderMid(); renderHud(); });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
let wasPhone = isPhone();
window.addEventListener('resize', () => { if (isPhone() !== wasPhone){ wasPhone = isPhone(); closeOvSilently(); setMid(false); renderAll(); } });

/* ================= 离线 ================= */
let offline = '离线使用：第一次联网打开后就能离线使用。';
if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:'){
  let hadCtrl = !!navigator.serviceWorker.controller;
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (!hadCtrl){ hadCtrl = true; return; }
    showToast('新版本已经下载好，你的记录都已存好', () => location.reload(), '现在更新', 30000);
  });
  navigator.serviceWorker.register('./sw.js').then(reg => {
    document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') reg.update().catch(() => {}); });
    return navigator.serviceWorker.ready;
  }).then(() => { offline = '离线使用：已准备好，没有网络也能从主屏幕打开。'; }).catch(() => {});
}
renderAll();
window.__six = { get M(){ return M; }, store: () => store, sixOf: sixOf, projection: projection, parts: parts, tally: tally, minsOf: minsOf, fullHalf: fullHalf, cornerSrc: cornerSrc, xcOf: xcOf };
})();
