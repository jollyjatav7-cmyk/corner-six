<!doctype html>
<html lang="zh-Hans">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="角球六要素">
<meta name="theme-color" content="#2F6C4B">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="./icon-192.png">
<title>角球六要素</title>
<style>
:root{
  --paper:#F1F3EF; --card:#FFFFFF; --raise:#F5F7F4; --ink:#14201A; --ink2:#46544C; --muted:#748178; --rule:#D3DAD4; --line2:#E3E7E2;
  --grass:#2F6C4B; --pitch:#24573D; --pitch2:#1F4D35; --chalk:#F3F5EE; --chalk2:rgba(243,245,238,.66); --tile:rgba(255,255,255,.08); --tile2:rgba(255,255,255,.16);
  --flag:#F2C230; --on-flag:#2A2100; --home:#2A58D3; --away:#CF4229; --warn:#B3261E; --ok:#2F8A57; --scrim:rgba(8,14,10,.45);
  --l1:#E4ECE6; --l2:#C6DCCD; --l3:#93BFA2; --l4:#4E9168; --l5:#24573D; --on-l:#14201A; --on-l4:#FFFFFF;
  --f-ui:-apple-system,BlinkMacSystemFont,"PingFang SC","Noto Sans SC","Microsoft YaHei",sans-serif;
  --f-num:"Avenir Next Condensed","DIN Condensed","Roboto Condensed","Arial Narrow",-apple-system,sans-serif;
  --pipH:0px;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root{
  --paper:#101613; --card:#18201C; --raise:#1C2520; --ink:#E4EAE5; --ink2:#AFBAB3; --muted:#7F8C85; --rule:#2B3530; --line2:#28322D;
  --grass:#2B6445; --pitch:#1E4A33; --pitch2:#1A422D; --home:#86A9FF; --away:#FF8E72; --warn:#FF6B5E; --ok:#5CC08A; --scrim:rgba(0,0,0,.6);
  --l1:#26302B; --l2:#2F4A3A; --l3:#3D6B50; --l4:#4E9168; --l5:#7CC496; --on-l:#E4EAE5; --on-l4:#0E1611;
  color-scheme:dark;
}}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:var(--paper);color:var(--ink);font:15px/1.4 var(--f-ui);-webkit-text-size-adjust:100%;overscroll-behavior:none}
button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}
button:focus-visible,input:focus-visible{outline:2px solid var(--flag);outline-offset:2px}
input,textarea{font:inherit;color:inherit}
.num{font-family:var(--f-num);font-variant-numeric:tabular-nums}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

/* ---------- 比分列 ---------- */
.app{min-height:100%;display:flex;flex-direction:column;padding:env(safe-area-inset-top) env(safe-area-inset-right) 0 env(safe-area-inset-left)}
.bar{display:grid;grid-template-columns:minmax(0,1fr) auto minmax(0,1fr);align-items:center;gap:12px;padding:10px 20px 8px}
.meta{display:flex;flex-direction:column;gap:2px;min-width:0}
.meta input{border:0;background:none;padding:0;font-weight:600;font-size:15px;min-width:0;width:100%}
.meta input::placeholder{color:var(--muted)}
.meta .sub{font-size:12px;color:var(--muted)}
.score{display:grid;grid-template-columns:minmax(0,9em) auto auto auto minmax(0,9em);align-items:center;gap:10px}
.tn{display:flex;flex-direction:column;min-width:0}
.tn.h{align-items:flex-end;text-align:right} .tn.a{align-items:flex-start}
.tn input{border:0;background:none;padding:0;font-weight:700;font-size:17px;width:100%;text-overflow:ellipsis}
.tn.h input{text-align:right;color:var(--home)} .tn.a input{color:var(--away)}
.tn input::placeholder{color:inherit;opacity:.55}
.cks{border:0;background:none;padding:3px 0;font-size:12px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.gl{border:0;background:none;padding:0 3px;border-radius:8px;font:600 40px/1 var(--f-num);min-width:.7em;text-align:center}
.gl.h{color:var(--home)} .gl.a{color:var(--away)}
.gl:active,.cks:active{background:var(--rule)}
.clk{display:flex;align-items:center;gap:8px}
.clkbtn{border:0;background:none;padding:0;display:flex;flex-direction:column;align-items:center}
.clkbtn span{font-size:12px;color:var(--muted);line-height:1}
.clkbtn b{font:600 34px/1.05 var(--f-num);font-variant-numeric:tabular-nums}
.clk.idle .clkbtn b{color:var(--muted)}
.run{width:40px;height:40px;border-radius:20px;border:0;background:var(--grass);color:var(--chalk);display:grid;place-items:center}
.run.on{background:var(--card);color:var(--ink);box-shadow:inset 0 0 0 1px var(--rule)}
.run svg{width:16px;height:16px}
.bar .tools{justify-self:end;display:flex;gap:6px;align-items:center}
.tbtn{height:36px;padding:0 12px;border:0;border-radius:10px;background:none;color:var(--ink2);font-weight:500;white-space:nowrap}
.tbtn:active{background:var(--rule)}
.tbtn.ic{width:40px;padding:0;display:grid;place-items:center}

/* ---------- 主区：iPad 三栏 ---------- */
.main{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,380px) minmax(0,1fr);grid-template-areas:"home mid away";gap:14px;padding:6px 20px 76px;align-items:start}
.pad[data-i="0"]{grid-area:home} .pad[data-i="1"]{grid-area:away} .mid{grid-area:mid}
.pad{min-width:0}
.pad-h{display:flex;align-items:center;gap:8px;padding:2px 2px 8px;font-size:14px}
.pad-h i{width:9px;height:9px;border-radius:50%;display:inline-block;flex:none}
.pad[data-i="0"] .pad-h i{background:var(--home)} .pad[data-i="1"] .pad-h i{background:var(--away)}
.pad-h b{font-size:16px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pad[data-i="0"] .pad-h b{color:var(--home)} .pad[data-i="1"] .pad-h b{color:var(--away)}
.pad-h .sp{flex:1}
.pad-h .tot{font-size:12px;color:var(--muted);white-space:nowrap}
.undo{height:30px;padding:0 12px;border-radius:15px;border:1px solid var(--line2);background:var(--card);font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap;max-width:62%;overflow:hidden;text-overflow:ellipsis}
.undo.hot{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.undo:disabled{opacity:.35}
.board{background:var(--pitch);color:var(--chalk);border-radius:18px;padding:10px;display:grid;gap:6px}
.big2{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.k{position:relative;border:0;border-radius:12px;background:var(--tile);color:var(--chalk);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:6px 4px;min-height:52px}
.k:active{background:var(--tile2)}
.k .l{font-size:14px;font-weight:600;line-height:1.15;text-align:center;white-space:nowrap}
.k .c{font:600 18px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--chalk2)}
.k.big{min-height:64px;flex-direction:row;gap:10px}
/* 跟平均比：均x（公开数据里同样是主队／客队的球队，在你看的同样时间里平均几次）；↑明显比平均多、↓明显比平均少 */
.av{font:500 11px/1 var(--f-num);font-variant-numeric:tabular-nums;color:var(--chalk2);white-space:nowrap;letter-spacing:.01em}
.av.up{color:var(--flag);font-weight:700}
.av.dn{opacity:.6}
.av:empty{display:none}
.k.ckb .av,.k.ckb .av.up{color:var(--on-flag)} .k.ckb .av.up{font-weight:800}
.k.big .av{font-size:12px}
.rl .av{font:500 11.5px/1 var(--f-num);margin-top:3px;color:var(--chalk2)}
.rl .av.up{font-weight:700;color:var(--flag)}
.row5 .k{padding:6px 2px}
.row5 .k .av{font-size:10.5px;letter-spacing:-.02em}
@media (min-width:900px) and (max-width:1100px){.row5 .k .av{font-size:9.5px;letter-spacing:-.04em}}
.k.big .l{font-size:17px}
.k.big .c{font-size:26px}
.k.ckb{background:var(--flag);color:var(--on-flag)} .k.ckb .c{color:var(--on-flag);opacity:.75}
.k.ckb:active{filter:brightness(.92)}
.k.goal{box-shadow:inset 0 0 0 1.5px var(--chalk2)}
.k.hit{animation:hit .45s ease-out}
@keyframes hit{0%{background:rgba(243,245,238,.6)}100%{background:var(--tile)}}
.k.ckb.hit{animation:hitf .45s ease-out}
@keyframes hitf{0%{filter:brightness(1.25)}100%{filter:none}}
@media (prefers-reduced-motion:reduce){.k.hit,.k.ckb.hit{animation:none}}
.row5{display:grid;grid-template-columns:4.6em repeat(5,minmax(0,1fr));gap:5px;align-items:stretch}
.row5.two{grid-template-columns:4.6em repeat(2,minmax(0,1fr))}
.rl{display:flex;flex-direction:column;justify-content:center;padding:0 2px 0 4px;min-width:0}
.rl b{font-size:13px;font-weight:700;line-height:1.15}
.rl span{font:600 17px/1.1 var(--f-num);color:var(--chalk2)}
.row5 .k{min-height:50px}
.row5 .k .l{font-size:13.5px}
.row5 .k .c{font-size:15px}
.minor{display:flex;justify-content:center;gap:8px;padding-top:2px}
.minor .k{flex:0 1 auto;flex-direction:row;gap:6px;min-height:34px;padding:4px 14px;border-radius:17px;background:transparent;box-shadow:inset 0 0 0 1px rgba(243,245,238,.35)}
.minor .k .l{font-size:12.5px;font-weight:500}
.minor .k .c{font-size:14px}
.sep{height:1px;background:rgba(243,245,238,.18);margin:2px 0}
/* 手机：动作按键＋结果选单 */
.acts{position:relative;display:grid;gap:6px}
.ov{position:absolute;left:0;right:0;top:0;bottom:0;z-index:3;background:var(--pitch2);border-radius:12px;display:flex;flex-direction:column;gap:5px;padding:0}
.ov[hidden]{display:none}
.ov-h{display:flex;align-items:center;gap:6px;padding:2px 2px 0 6px;min-height:30px}
.ov-h b{flex:1;font-size:13.5px;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ov.fol .ov-h b{color:var(--flag)}
.ov-h button{border:0;background:none;color:var(--chalk2);font-size:12.5px;height:30px;padding:0 6px;white-space:nowrap}
.ov-t{height:3px;border-radius:2px;background:var(--tile2);margin:0 6px;overflow:hidden}
.ov-t i{display:block;height:100%;background:var(--flag);width:100%;transform-origin:left center}
.ov-b{flex:1;display:grid;gap:5px;grid-auto-rows:minmax(0,1fr)}
.ov-b .k{min-height:0}
.ov-b .k .l{font-size:16px}

/* ---------- 中间卡片 ---------- */
.mid{min-width:0;background:var(--card);border:1px solid var(--line2);border-radius:18px;padding:12px 14px;display:flex;flex-direction:column;gap:10px}
.tabs{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--paper);border-radius:11px;padding:3px;flex:none}
.tabs button{height:32px;border:0;border-radius:9px;background:none;font-size:13px;color:var(--ink2);white-space:nowrap}
.tabs button[aria-selected="true"]{background:var(--card);box-shadow:0 1px 2px rgba(0,0,0,.08);font-weight:700;color:var(--ink)}
.mid[data-tab="six"] .tabp:not([data-tab="six"]),.mid[data-tab="data"] .tabp:not([data-tab="data"]),.mid[data-tab="ck"] .tabp:not([data-tab="ck"]){display:none}
.mid-top{display:none}
.tabp{display:flex;flex-direction:column;gap:10px}
.seg{display:inline-flex;background:var(--paper);border-radius:10px;padding:2px;box-shadow:inset 0 0 0 1px var(--rule)}
.seg button{border:0;background:none;height:30px;padding:0 10px;border-radius:8px;font-size:13px;font-weight:600;color:var(--ink2);white-space:nowrap}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper)}
.shead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.shead .sp{flex:1}
.basel{border:0;background:none;padding:4px 0;font-size:12px;color:var(--muted);text-decoration:underline dotted;text-underline-offset:3px;white-space:nowrap}
.six{width:100%;border-collapse:collapse;table-layout:fixed}
.six th{font-size:12px;font-weight:700;padding:0 0 6px;text-align:left;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.six th.h{color:var(--home)} .six th.a{color:var(--away)}
.six th.fn,.six td.fn{width:5.2em}
.six td{border-top:1px solid var(--rule);padding:7px 4px 7px 0;vertical-align:top}
.six td.fn{font-size:12.5px;font-weight:700;color:var(--ink2);line-height:1.25;padding-right:6px}
.six td.fn small{display:block;font-weight:500;font-size:10.5px;color:var(--muted)}
.cell{border:0;background:none;padding:0;text-align:left;display:flex;flex-direction:column;gap:3px;width:100%;color:var(--ink);min-width:0}
.cell:active{opacity:.7}
.lv{display:flex;align-items:center;gap:6px;min-width:0}
.lv em{font-style:normal;font-size:13px;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.bd{flex:none;min-width:24px;height:24px;border-radius:7px;display:inline-grid;place-items:center;font:700 15px/1 var(--f-num);background:var(--l1);color:var(--on-l)}
.bd.v1{background:var(--l1)} .bd.v2{background:var(--l2)} .bd.v3{background:var(--l3)} .bd.v4{background:var(--l4);color:var(--on-l4)} .bd.v5{background:var(--l5);color:var(--on-l4)}
.bd.na{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--muted);font-size:13px}
.bd.man{box-shadow:0 0 0 2px var(--flag)}
.mt{font-size:11.5px;color:var(--muted);line-height:1.35}
.mt b{font:600 13px var(--f-num);color:var(--ink2)}
.f2b{display:flex;gap:3px;flex-wrap:wrap}
.f2b span{font-size:11px;color:var(--ink2);background:var(--paper);border-radius:6px;padding:1px 5px;white-space:nowrap}
.f2b span b{font:700 12px var(--f-num);margin-left:2px}
.f2b span.top{background:var(--l4);color:var(--on-l4)}
.cmb{font-size:12px;color:var(--ink2);font-weight:600;line-height:1.35}
.cmb small{display:block;font-weight:500;color:var(--muted);font-size:11px}
.ckv{font:600 26px/1 var(--f-num)}
.ckv small{font:500 12px var(--f-ui);color:var(--muted);margin-left:4px}
.proj{font-size:12px;color:var(--ink2);line-height:1.4}
.proj b{font:700 15px var(--f-num);color:var(--ink)}
.fac{display:block;margin-top:4px;font-size:11px;line-height:1.35;color:var(--muted)}
.note{font-size:12px;line-height:1.5;color:var(--muted);margin:0}
.dt{width:100%;border-collapse:collapse;font-size:13px;table-layout:fixed}
.dt th{font-size:11.5px;font-weight:700;color:var(--muted);text-align:right;padding:2px 0 6px}
.dt th:first-child{text-align:left;width:38%}
.dt3 th:first-child{width:34%}
.dt th.h{color:var(--home)} .dt th.a{color:var(--away)}
.dt td{border-top:1px solid var(--rule);padding:6px 0;text-align:right;font:600 15px var(--f-num);font-variant-numeric:tabular-nums}
.dt td:first-child{text-align:left;font:600 13px var(--f-ui);color:var(--ink2)}
.dt td small{font:500 11px var(--f-ui);color:var(--muted);margin-left:2px}
.dt .av{color:var(--muted);margin-left:4px;font-size:11.5px}
.dt .av.up{color:var(--ink);opacity:1} .dt .av.dn{opacity:.75}
.dt tr.sub td:first-child{font-weight:500;color:var(--muted);padding-left:12px}
.dt tr.sub td{font-size:14px;color:var(--ink2)}
.srcl{display:grid;gap:4px}
.srcr{display:grid;grid-template-columns:minmax(0,1fr) 2.2em;gap:8px;font-size:13px;align-items:baseline}
.srcr b{font:700 15px var(--f-num);text-align:right}
.srcr span{color:var(--ink2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cki{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.cki h4{margin:0 0 6px;font-size:13px}
.cki h4.h{color:var(--home)} .cki h4.a{color:var(--away)}
@media (min-width:900px){
  .main{align-items:stretch}
  .main .mid{max-height:calc(100vh - 150px);overflow:auto;overscroll-behavior:contain;position:sticky;top:8px;align-self:start}
}
@media (min-width:900px) and (max-width:1150px){.pad-h .tot{display:none}}
@media (min-width:900px) and (max-height:860px){
  .bar{padding:6px 20px 4px}
  .board{padding:8px;gap:5px}
  .k{min-height:46px} .row5 .k{min-height:44px} .k.big{min-height:54px}
}
@media (max-width:899px){
  .main{grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"home away" "mid mid";gap:10px;padding:6px 12px 80px}
  .bar{grid-template-columns:minmax(0,1fr) auto;grid-template-areas:"meta tools" "score score";padding:8px 12px 6px;row-gap:4px}
  .bar .meta{grid-area:meta;flex-direction:row;align-items:baseline;gap:10px}
  .bar .meta input{width:auto;flex:1}
  .bar .tools{grid-area:tools}
  .score{grid-area:score;justify-self:stretch;grid-template-columns:minmax(0,1fr) auto auto auto minmax(0,1fr)}
}

/* ---------- 底部快捷栏 ---------- */
.strip{position:fixed;left:0;right:0;bottom:0;z-index:5;background:var(--raise);border-top:1px solid var(--rule);
  padding:8px max(12px,env(safe-area-inset-right)) calc(8px + env(safe-area-inset-bottom)) max(12px,env(safe-area-inset-left));display:flex;align-items:center;gap:10px}
.recent{flex:1;min-width:0;display:flex;gap:14px;overflow:hidden;font-size:13px;white-space:nowrap;color:var(--ink2)}
.recent button{border:0;background:none;padding:4px 0;display:flex;gap:6px;align-items:baseline;color:var(--ink2)}
.recent .t{font:600 14px var(--f-num);color:var(--muted)}
.recent .d0{color:var(--home)} .recent .d1{color:var(--away)}
.recent .empty{color:var(--muted)}
.qb{border:0;height:38px;padding:0 12px;border-radius:19px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);display:inline-flex;align-items:center;gap:6px;font-weight:600;font-size:14px;white-space:nowrap;color:var(--ink)}
.qb:active{background:var(--rule)}
.qb svg{width:18px;height:18px;flex:none}
.qb small{font-size:11px;font-weight:500;color:var(--muted)}
@media (min-width:600px){.qb small:empty{display:none}}
.qb:disabled{opacity:.4}
.qb.only-phone{display:none}

/* ---------- 弹出视窗 ---------- */
.sheet{position:fixed;left:0;right:0;top:0;bottom:0;z-index:20;background:var(--scrim);display:flex;align-items:flex-end;justify-content:center}
.sheet[hidden]{display:none}
.card{width:100%;max-width:560px;max-height:88vh;overflow:auto;-webkit-overflow-scrolling:touch;background:var(--card);border-radius:18px 18px 0 0;padding:16px 18px calc(18px + env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:12px}
.card.wide{max-width:740px}
@media (min-width:700px){.sheet{align-items:center}.card{border-radius:18px}}
.card-h{display:flex;align-items:center;gap:10px}
.card-h h3{margin:0;font-size:17px;flex:1;min-width:0}
.pill{height:38px;padding:0 14px;border:0;border-radius:19px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-weight:600;white-space:nowrap}
.pill:active{background:var(--rule)}
.pill.dark{background:var(--ink);color:var(--paper);box-shadow:none}
.pill.green{background:var(--grass);color:var(--chalk);box-shadow:none}
.pill.danger{background:var(--warn);color:#fff;box-shadow:none}
.pill:disabled{opacity:.45}
.pill.bigp{height:46px;font-size:15px}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{height:34px;padding:0 12px;border:0;border-radius:17px;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);font-size:13.5px;white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);box-shadow:none}
.chip:disabled{opacity:.4}
.lbl{font-size:12.5px;color:var(--muted);margin-bottom:-6px}
.hint{font-size:12.5px;color:var(--muted);margin:0;line-height:1.55}
.netnote{margin:0;font-size:13px;line-height:1.5;color:var(--ink2);background:var(--paper);border-radius:10px;padding:8px 10px}
.big-clk{font:600 54px/1 var(--f-num);font-variant-numeric:tabular-nums;text-align:center}

.hlp h4{margin:0 0 2px;font-size:15px}

.wbar .fi{flex:1;height:38px}

.wrow>button{border:0;background:none;width:100%;text-align:left;padding:10px 2px;display:grid;gap:3px;color:var(--ink)}

.wrow .w1{font-weight:600;font-size:14.5px;display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.wrow .w2{font-size:12.5px;color:var(--muted)}
.wtag{font-style:normal;font-size:11px;font-weight:700;border-radius:8px;padding:0 6px;line-height:18px;background:var(--paper);color:var(--ink2);box-shadow:inset 0 0 0 1px var(--rule)}

.sts{width:100%;border-collapse:collapse;font-size:13px;text-align:center}

.sts td.tl{font:600 13px var(--f-ui);text-align:left;color:var(--ink2)}

.sts td.dim{color:var(--muted)}
.wst{display:grid;gap:16px}
.wst h4{margin:0 0 6px;font-size:14px}
.tidy{display:grid;gap:8px;background:var(--paper);border-radius:12px;padding:10px 12px}
.tidy b{font-size:14px}
.tidy p{margin:0;font-size:12.5px;color:var(--muted);line-height:1.5}
.defs{display:grid;gap:14px}
.defs h4{margin:0 0 3px;font-size:15px}
.defs p{margin:0;font-size:13.5px;line-height:1.6;color:var(--ink2)}
.defs ul{margin:4px 0 0;padding-left:18px;font-size:13px;line-height:1.6;color:var(--ink2)}
.yt{width:100%;border-collapse:collapse;font-size:13px}
.yt td{border-top:1px solid var(--rule);padding:5px 0}

.toast{position:fixed;left:0;right:0;margin:0 auto;width:-webkit-fit-content;width:fit-content;max-width:calc(100vw - 24px);bottom:calc(70px + env(safe-area-inset-bottom));z-index:30;background:var(--ink);color:var(--paper);border-radius:22px;padding:8px 8px 8px 16px;display:flex;align-items:center;gap:10px;font-size:14px;box-shadow:0 6px 24px rgba(0,0,0,.18)}
.toast[hidden]{display:none}
#toastMsg{min-width:0;display:-webkit-box;-webkit-box-orient:vertical;-webkit-line-clamp:3;overflow:hidden;line-height:1.35}
.toast button{border:0;background:var(--flag);color:var(--on-flag);border-radius:16px;height:32px;padding:0 12px;font-weight:700;white-space:nowrap;flex-shrink:0}
.toast button[hidden]{display:none}
.hud,.scrim{display:none}
/* 联网 */
.netpill{display:inline-flex;align-items:center;gap:6px;height:30px;padding:0 10px;border-radius:15px;background:var(--card);border:1px solid var(--line2);font-size:12px;color:var(--ink2);white-space:nowrap;max-width:16em;overflow:hidden}
.netpill[hidden]{display:none}
.netpill i{width:7px;height:7px;border-radius:50%;background:var(--ok);flex:none}
.netpill.off i{background:var(--muted)}
.netpill.bad{color:var(--warn);border-color:var(--warn)} .netpill.bad i{background:var(--warn)}
.netpill span{overflow:hidden;text-overflow:ellipsis}
.sugg{margin:2px 20px 10px;background:var(--card);border-radius:14px;padding:10px 12px 12px;box-shadow:0 0 0 2px var(--flag);display:grid;gap:8px;flex:none}
.sugg[hidden]{display:none}
.sg-h{display:flex;align-items:baseline;gap:4px 10px;flex-wrap:wrap}

.sg-h span{flex:1;font-size:12.5px;color:var(--muted);min-width:12em}

.sg-f{display:flex;gap:8px;align-items:center}
.sg-f .fi{flex:1;height:38px}
.picks{display:grid;gap:6px;grid-template-columns:repeat(auto-fill,minmax(250px,1fr))}
.picks button{border:0;text-align:left;background:var(--paper);box-shadow:inset 0 0 0 1px var(--rule);border-radius:12px;padding:10px 12px;display:grid;gap:3px;color:var(--ink)}
.picks button:active{background:var(--rule)}
.picks .t1{font-weight:600;font-size:15px}
.picks .t1 b{font:600 16px var(--f-num);margin:0 6px}
.picks .t2{font-size:12.5px;color:var(--muted)}
.picks em{font-style:normal;color:var(--warn)}
.qb{position:relative}
.qb .dot{position:absolute;top:4px;right:6px;width:8px;height:8px;border-radius:50%;background:var(--warn);box-shadow:0 0 0 2px var(--raise)}
.qb.alert small{color:var(--warn)}
.mrow{border-bottom:1px solid var(--rule);padding:10px 0;display:grid;gap:6px}
.mrow .t1{font-weight:600}
.mrow .t2{font-size:12.5px;color:var(--muted)}
.apil{font-size:12.5px;color:var(--ink2);background:var(--paper);border-radius:10px;padding:7px 10px;line-height:1.5}
.apil b{font:600 14px var(--f-num);color:var(--ink)}
.apil small{color:var(--muted)}
.list .auto{font-size:10.5px;color:var(--grass);margin-left:4px;font-weight:600}
.pipband{display:none}

/* ---------- 手机：两栏动作按键＋上方摘要＋下方抽屉 ---------- */
@media (max-width:599px){
  html,body{height:100%}
  .app{height:100vh;height:100dvh}
  .bar{padding:6px 10px 4px}
  .bar .tools .tbtn{height:30px}
  #defBtn{display:none}
  .gl{font-size:30px}
  .clkbtn b{font-size:26px}
  .run{width:34px;height:34px}
  .tn input{font-size:15px}
  .score{gap:6px}
  .hud{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);margin:4px 10px 0;background:var(--card);border:1px solid var(--line2);border-radius:14px;overflow:hidden;flex:none}
  .hud-c{border:0;background:none;text-align:left;padding:5px 9px 6px;display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:8px;row-gap:3px;align-items:center;color:var(--ink);min-width:0}
  .hud-c+.hud-c{border-left:1px solid var(--line2)}
  .hud-c .ckn{grid-row:1/3;font:600 28px/1 var(--f-num)}
  .hud-c .ckn small{display:block;font:500 9.5px var(--f-ui);color:var(--muted);text-align:center;margin-top:1px}
  .hud-c .pj{font-size:11px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .hud-c .pj b{font:700 13px var(--f-num);color:var(--ink2)}
  .mini{display:flex;gap:3px}
  .mini i{font-style:normal;flex:1 1 0;min-width:0;height:19px;border-radius:5px;display:grid;place-items:center;font:700 11.5px/1 var(--f-num);background:var(--l1);color:var(--on-l)}
  .mini i.v1{background:var(--l1)} .mini i.v2{background:var(--l2)} .mini i.v3{background:var(--l3)} .mini i.v4{background:var(--l4);color:var(--on-l4)} .mini i.v5{background:var(--l5);color:var(--on-l4)}
  .mini i.na{background:none;box-shadow:inset 0 0 0 1px var(--rule);color:var(--muted)}
  .mini i.tx{font:600 10px/1 var(--f-ui)}
  .hud-s{display:none}
  .main{flex:1;min-height:0;display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);grid-template-areas:"home away";grid-template-rows:minmax(0,1fr);align-items:stretch;gap:8px;padding:6px 10px calc(60px + env(safe-area-inset-bottom))}
  .main .pad{display:flex;flex-direction:column;min-height:0}
  .pad-h{padding:0 2px 5px;gap:6px}
  .pad-h b{font-size:15px;flex:0 1 auto}
  .pad-h .tot{display:none}
  .undo{height:28px;padding:0 10px;font-size:12px;max-width:none;flex:none}
  .board{flex:1;min-height:0;padding:6px;gap:5px;border-radius:16px;display:flex;flex-direction:column}
  .acts{flex:1;min-height:0;grid-auto-rows:minmax(0,1fr)}
  .acts>.k{min-height:0;flex-direction:row;gap:8px;padding:2px 6px}
  .acts>.k .l{font-size:15px}
  .acts>.k .c{font-size:19px}
  .main .mid{position:fixed;left:0;right:0;bottom:0;z-index:16;max-height:86vh;overflow:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;border-radius:22px 22px 0 0;border:0;box-shadow:0 -10px 40px rgba(0,0,0,.2);padding:4px 14px calc(18px + env(safe-area-inset-bottom));-webkit-transform:translateY(105%);transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s .25s}
  .main .mid.open{-webkit-transform:none;transform:none;visibility:visible;transition:transform .25s ease}
  .mid-top{display:flex;align-items:center;justify-content:center;position:relative;height:24px;flex:none}
  .mid-top .grip{width:40px;height:5px;border-radius:3px;background:var(--rule)}
  .mid-x{position:absolute;right:0;top:-2px;border:0;background:none;font-size:13px;color:var(--ink2);height:28px;padding:0 4px}
  .scrim{position:fixed;left:0;right:0;top:0;bottom:0;z-index:15;background:var(--scrim);display:block}
  .scrim[hidden]{display:none}
  .strip{justify-content:space-around;gap:0;padding:3px 4px calc(3px + env(safe-area-inset-bottom))}
  .strip .recent,.strip .only-pad{display:none}
  .qb .dot{top:4px;right:calc(50% - 18px)}
  .qb small{font-size:9.5px;line-height:1.2;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .sugg{margin:4px 10px 6px}
  .netpill{height:26px;padding:0 8px;font-size:11px;max-width:10em}
  .qb.only-phone{display:inline-flex}
  .qb{flex:1 1 0;min-width:0;height:50px;padding:2px;border-radius:12px;background:none;box-shadow:none;flex-direction:column;justify-content:center;gap:1px;font-size:11.5px;line-height:1.2;color:var(--ink2)}
  .qb svg{width:20px;height:20px}
  .toast{top:calc(6px + env(safe-area-inset-top));bottom:auto}
  @media (max-height:700px){.acts>.k .l{font-size:14px}.acts>.k .c{font-size:17px}.hud-c .ckn{font-size:24px}}
}
@media (max-width:389px){
  .pad-h b{max-width:52%}
  .acts>.k .l{font-size:14px}
  .mini i{font-size:10.5px}
}
/* 视频浮窗：手机上空出浮窗的位置 */
@media (max-width:599px){
  body.pip-top .pipband{display:flex;flex:none;height:var(--pipH);margin:4px 10px 0;border:1.5px dashed var(--rule);border-radius:14px;align-items:center;justify-content:center;color:var(--muted);font-size:12px;text-align:center;padding:0 12px}
  body.pip-bot .pipband{display:flex;position:fixed;left:10px;right:10px;bottom:calc(4px + env(safe-area-inset-bottom));height:var(--pipH);border:1.5px dashed var(--rule);border-radius:14px;align-items:center;justify-content:center;color:var(--muted);font-size:12px;z-index:1;background:var(--paper)}
  body.pip-bot .strip{bottom:calc(var(--pipH) + 8px + env(safe-area-inset-bottom));padding-bottom:3px;border-bottom:1px solid var(--rule)}
  body.pip-bot .main{padding-bottom:calc(66px + var(--pipH) + env(safe-area-inset-bottom))}
  body.pip-top .toast{top:calc(var(--pipH) + 10px + env(safe-area-inset-top))}
  body.pip-bot .sheet{padding-bottom:calc(var(--pipH) + 8px + env(safe-area-inset-bottom))}
  body.pip-bot .card{border-radius:18px;max-height:calc(100vh - var(--pipH) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  body.pip-bot .main .mid{bottom:calc(var(--pipH) + 8px + env(safe-area-inset-bottom));border-radius:22px;max-height:calc(100vh - var(--pipH) - 24px - env(safe-area-inset-top) - env(safe-area-inset-bottom))}
  body.pip-top .card{max-height:calc(100vh - var(--pipH) - 16px - env(safe-area-inset-top))}
  body.pip-top .main .mid{max-height:calc(100vh - var(--pipH) - 16px - env(safe-area-inset-top))}
  /* 浮窗模式：比分和时间搬进摘要条，按键压缩 */
  body.pip-on .bar{display:none}
  body.pip-on .hud{grid-template-columns:minmax(0,.8fr) minmax(0,1fr) minmax(0,1fr)}
  body.pip-on .hud-s{display:flex;flex-direction:column;align-items:center;justify-content:center;border:0;border-right:1px solid var(--line2);background:var(--paper);padding:4px 2px;color:var(--ink);min-width:0}
  body.pip-on .hud-s b{font:600 21px/1.05 var(--f-num)}
  body.pip-on .hud-s b i{font-style:normal;color:var(--home)} body.pip-on .hud-s b i+i{color:var(--away)}
  body.pip-on .hud-s small{font:600 12px var(--f-num);color:var(--muted)}
  body.pip-on .hud-s.kick{background:var(--grass);color:var(--chalk)} body.pip-on .hud-s.kick small{color:var(--chalk2)}
  body.pip-on .hud-c{grid-template-columns:minmax(0,1fr);padding:4px 6px 5px}
  body.pip-on .hud-c .ckn{grid-row:auto;font-size:20px;display:flex;align-items:baseline;gap:4px}
  body.pip-on .hud-c .ckn small{display:inline;margin:0}
  body.pip-on .hud-c .pj{display:none}
  body.pip-on .main{padding-top:5px;gap:6px}
  body.pip-on .pad-h{padding:0 2px 3px}
  body.pip-on .pad-h b{font-size:13.5px}
  body.pip-on .undo{height:24px;font-size:11.5px}
  body.pip-on .board{padding:5px;gap:4px;border-radius:14px}
  body.pip-on .acts{gap:4px}
  body.pip-on .acts>.k .l{font-size:13.5px}

<body>
<div class="app">
  <div class="pipband" id="pipBand" aria-hidden="true">视频浮窗放在这里（功能 → 视频浮窗 可以调整）</div>
  <header class="bar">
    <div class="meta">
      <input id="fLg" placeholder="输入联赛" maxlength="24" autocomplete="off" aria-label="联赛">
      <span class="sub" id="mDate"></span>
    </div>
    <div class="score">
      <div class="tn h"><input id="fH" placeholder="主队" maxlength="20" autocomplete="off" aria-label="主队名称"><button class="cks" id="ckH" data-a="fix">角球 0</button></div>
      <button class="gl h" id="glH" data-a="fix" aria-label="主队进球，点一下补录或校正">0</button>
      <div class="clk idle" id="clk">
        <button class="clkbtn" id="clkBtn" data-a="clock" aria-label="比赛时间"><span id="perL">上半场</span><b id="clkT">00:00</b></button>
        <button class="run" id="runBtn" aria-label="开始计时"></button>
      </div>
      <button class="gl a" id="glA" data-a="fix" aria-label="客队进球，点一下补录或校正">0</button>
      <div class="tn a"><input id="fA" placeholder="客队" maxlength="20" autocomplete="off" aria-label="客队名称"><button class="cks" id="ckA" data-a="fix">角球 0</button></div>
    </div>
    <div class="tools">
      <button class="netpill" id="netPill" data-a="netpill" hidden></button>
      <button class="tbtn" id="defBtn" data-a="defs">按键定义</button>
      <button class="tbtn ic" data-a="menu" aria-label="功能"><svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true"><path d="M3 5h12M3 9h12M3 13h12" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg></button>
    </div>
  </header>
  <section class="sugg" id="sugg" hidden aria-live="polite"></section>
  <section class="hud" id="hud" aria-label="六项摘要"></section>
  <main class="main">
    <section class="pad" data-i="0" aria-label="主队控球"></section>
    <section class="mid" id="mid" data-tab="six" aria-label="六项评估">
      <div class="mid-top"><span class="grip"></span><button class="mid-x" data-a="midclose">收起</button></div>
      <div class="tabs" role="tablist">
        <button role="tab" data-tab="six" aria-selected="true">六项</button>
        <button role="tab" data-tab="data" aria-selected="false">数据</button>
        <button role="tab" data-tab="ck" aria-selected="false">角球</button>
      </div>
      <div class="tabp" data-tab="six" id="tabSix"></div>
      <div class="tabp" data-tab="data" id="tabData"></div>
      <div class="tabp" data-tab="ck" id="tabCk"></div>
    </section>
    <section class="pad" data-i="1" aria-label="客队控球"></section>
  </main>
</div>
<div class="strip" id="strip">
  <div class="recent" id="recent"></div>
  <button class="qb" data-a="undo" id="qbUndo"></button>
  <button class="qb" data-a="qsync" id="qbSync"></button>

/* ================= 比赛仓库 ================= */
const hasContent = m => !!(m.ev.length || m.tm.b || m.tm.r);
function whAll(){ return Object.keys(store).map(k => store[k]).filter(m => hasContent(m) || m.h.trim() || m.a.trim()).sort((a, b) => (b.u || b.c) - (a.u || a.c)); }
function whListPage(d){
  const all = whAll(), f = d.f || 'all', nDone = all.filter(m => m.st === 2).length;
  return '<div class="wbar"><input class="fi" id="whQ" type="search" placeholder="搜索球队、联赛或日期" value="' + esc(d.q || '') + '" autocomplete="off" autocapitalize="off" spellcheck="false"></div>'
    + '<div class="chips">' + [['all', '全部 ' + all.length], ['done', '已结束 ' + nDone], ['open', '未结束 ' + (all.length - nDone)]].map(x => '<button class="chip" data-a="wf" data-v="' + x[0] + '" aria-pressed="' + (f === x[0]) + '">' + x[1] + '</button>').join('') + '</div>'
    + '<div id="whList">' + whListHTML(d) + '</div>';
}
function whListHTML(d){
  const f = d.f || 'all', q = (d.q || '').trim().toLowerCase();
  const list = whAll().filter(m => (f === 'all' || (f === 'done' ? m.st === 2 : m.st !== 2)) && (!q || [m.h, m.a, m.lg, m.d].some(x => String(x || '').toLowerCase().indexOf(q) >= 0)));
  if (!list.length) return '<p class="hint">' + (whAll().length ? '没有符合的比赛。' : '还没有比赛。结束一场比赛时选“加入仓库”，就会保存在这里。') + '</p>';
  return list.map(m => {
    const sc = score(m), c1 = [tally(m, 0, 'h1', true).ck || 0, tally(m, 1, 'h1', true).ck || 0], c2 = [tally(m, 0, 'h2', true).ck || 0, tally(m, 1, 'h2', true).ck || 0];
    const cur = m.id === M.id, open = d.open === m.id;
    const act = open ? '<div class="wact"><div class="row">' + (cur ? '' : '<button class="pill dark" data-a="mopen" data-id="' + esc(m.id) + '">打开</button>') + '<button class="pill" data-a="mexp" data-id="' + esc(m.id) + '">导出</button><button class="pill' + (d.del === m.id ? ' danger' : '') + '" data-a="mdel" data-id="' + esc(m.id) + '">' + (d.del === m.id ? '确定删除' : '删除') + '</button></div></div>' : '';
    return '<div class="wrow"><button data-a="wopen" data-id="' + esc(m.id) + '" aria-expanded="' + open + '"><span class="w1">' + esc(m.h || '主队') + ' ' + sc[0] + '–' + sc[1] + ' ' + esc(m.a || '客队') + (cur ? ' <i class="wtag live">目前这场</i>' : '') + (m.st !== 2 ? ' <i class="wtag">未结束</i>' : '') + '</span>'
      + '<span class="w2">' + esc(m.d) + (m.lg ? ' · ' + esc(m.lg) : '') + ' · 角球 ' + (c1[0] + c2[0]) + '–' + (c1[1] + c2[1]) + '（上半场 ' + c1[0] + '–' + c1[1] + '） · ' + m.ev.length + ' 笔</span></button>' + act + '</div>';
  }).join('');
}
/* 统计：只用整个半场都有看到的（检验等级跟角球的关系时） */
function whStats(){
  const done = Object.keys(store).map(k => store[k]).filter(m => m.st === 2 && hasContent(m));
  if (!done.length) return '<p class="hint">还没有结束的比赛。结束时选“加入仓库”，这里就会有平均进球、角球和六项统计。</p>';
  // 联赛平均
  const lg = {};
  let nAll = 0, gAll = 0, cFull = 0, nFull = 0, c1All = 0, n1 = 0;
  for (const m of done){
    const k = m.lg.trim() || '没填联赛', x = lg[k] || (lg[k] = { n: 0, g: 0, nf: 0, cf: 0, n1: 0, c1: 0 });
    const sc = score(m), ck1 = (tally(m, 0, 'h1', true).ck || 0) + (tally(m, 1, 'h1', true).ck || 0), ckf = (tally(m, 0, 'ft', true).ck || 0) + (tally(m, 1, 'ft', true).ck || 0);
    x.n++; x.g += sc[0] + sc[1]; nAll++; gAll += sc[0] + sc[1];
    if (fullHalf(m, 1) || ck1){ x.n1++; x.c1 += ck1; n1++; c1All += ck1; }
    if (m.stop && m.stop.p === 2 && m.stop.t >= PER[2][1] - 120){ x.nf++; x.cf += ckf; nFull++; cFull += ckf; }
  }
  const lgs = Object.keys(lg).sort((a, b) => lg[b].n - lg[a].n);
  let h = '<div class="wst"><div><h4>平均进球和角球（' + done.length + ' 场）</h4><table class="sts"><thead><tr><th>联赛</th><th>场数</th><th>进球</th><th>全场角球</th><th>上半场角球</th></tr></thead><tbody>'

function sixLevelsPub(c, co, mins){
  const P = parts(c, co, mins), b = BASE.half;
  const r = {};
  r.f1 = P.mins >= 8 ? lvlOf((P.ar + b.f1_rate.m * 0.5) / (P.mins + 5) * 10, b.f1_rate.q) : null;
  r.f3 = P.f3[1] >= 3 ? lvlOf(shrink(P.f3, b.f3_space.m, 3), b.f3_space.q) : null;
  r.f4 = P.f4[1] >= 3 ? lvlOf(shrink(P.f4, b.f4_block.m, 3), b.f4_block.q, true) : null;
  r.f5 = P.ar >= 3 ? lvlOf(shrink(P.f5, b.f5_aggr.m, 3), b.f5_aggr.q) : null;
  r.f6 = P.f6[1] >= 3 ? lvlOf(shrink(P.f6, b.f6_err.m, 3), b.f6_err.q, true) : null;
  r.f2 = null;
  if (P.ar >= 3){
    let top = null, best = 0;
    for (const x of [['d', 'f2_dcross'], ['e', 'f2_ecross'], ['p', 'f2_pen'], ['l', 'f2_lshot']]){ const rel = shrink([P.g[x[0]], P.ar], b[x[1]].m, 2) / b[x[1]].m; if (rel >= 1.2 && rel > best){ best = rel; top = x[0]; } }
    r.f2 = top || 'b';
  }
  return r;
}

function apiGet(path){
  const key = apiKey();
  if (!key) return Promise.reject(new Error('还没有设定 API key'));
  if (navigator.onLine === false) return Promise.reject(new Error('现在没有网络'));
  if (path.indexOf('/status') !== 0){ const k = dayKey(new Date()); const u = {}; u[k] = ((NET.used || {})[k] || 0) + 1; NET.used = u; saveNet(); }
  return fetch(API_BASE + path, { headers: { 'x-apisports-key': key } }).then(r => {
    if (!r.ok) throw new Error('API-Football 回应错误 ' + r.status);
    return r.json();
  }, () => { throw new Error('连不上 API-Football（没有网络，或被浏览器拦截）'); }).then(j => {
    const er = j && j.errors;
    if (er && !Array.isArray(er) && Object.keys(er).length){
      if (er.token) throw new Error('API key 不对，请在“联网数据”里重新贴上');
      if (er.requests) throw new Error('今天的请求次数用完了');

      throw new Error(Object.keys(er).map(k => er[k]).join('；'));

}

/* ---------- 队名比对：内置中文译名 → 英文，维基数据补查，加上你确认过的队名 ---------- */
const STOP = new Set(['fc', 'cf', 'afc', 'sc', 'ac', 'as', 'ss', 'us', 'club', 'de', 'calcio', 'cd', 'ud', 'sd', 'rc', 'sv', 'vfb', 'vfl', 'tsg', 'fk', 'sk', 'bk', 'if', 'ca', 'se', 'ec', '1', '04', '05', '1899']);
function normName(s){
  return String(s || '').replace(/\./g, '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/ø/g, 'o').replace(/ß/g, 'ss').replace(/ı/g, 'i')
    .replace(/[^a-z0-9一-鿿぀-ヿ가-힯]+/g, ' ').trim();
}
const coreW = s => s.split(' ').filter(w => w && !STOP.has(w));
function bigr(s){ const t = s.replace(/ /g, ''); const a = []; for (let i = 0; i < t.length - 1; i++) a.push(t.slice(i, i + 2)); return a.length ? a : [t]; }
function sim(a, b){
  if (!a || !b) return 0;
  if (a === b) return 1;
  const ca = coreW(a), cb = coreW(b);
  if (ca.length && ca.join(' ') === cb.join(' ')) return 0.95;
  const s = ca.length <= cb.length ? ca : cb, l = ca.length <= cb.length ? cb : ca;
  if (s.length && s.some(w => w.length >= 3) && s.every(w => l.some(x => x.indexOf(w) === 0 || (w.indexOf(x) === 0 && x.length >= 3)))) return 0.85 * (0.75 + 0.25 * s.length / l.length);
  const ba = bigr(ca.join(' ') || a), bb = bigr(cb.join(' ') || b), m = new Map();
  for (const x of bb) m.set(x, (m.get(x) || 0) + 1);
  let hit = 0; for (const x of ba){ const c = m.get(x); if (c){ hit++; m.set(x, c - 1); } }
  return 0.8 * 2 * hit / (ba.length + bb.length);
}
const WDC = Object.assign({}, LS.get('corner-sb-wd', {}) || {}, LS.get('corner-six-wd', {}) || {});
const MYWD = LS.get('corner-six-wd', {}) || {};
function nameKeys(u){
  const raw = String(u || '').trim(), cn = raw.replace(/\s+/g, '').toUpperCase(), keys = new Set([normName(raw)]);
  for (const x of TEAM_ZH) if (x[0].some(z => z.toUpperCase() === cn)) x[1].forEach(e => keys.add(normName(e)));
  const w = WDC[normName(raw)];
  if (w) w.en.forEach(e => keys.add(normName(e)));
  return Array.from(keys).filter(Boolean);
}
const WD_API = 'https://www.wikidata.org/w/api.php';
const hasCJK = x => /[一-鿿]/.test(x);
const inDict = raw => { const cn = raw.replace(/\s+/g, '').toUpperCase(); return TEAM_ZH.some(x => x[0].some(z => z.toUpperCase() === cn)); };
function wdPrep(u){
  const raw = String(u || '').trim(), k = normName(raw);
  if (!raw || !hasCJK(raw) || ALIAS[k] || inDict(raw)) return Promise.resolve();
  const c = WDC[k];
  if (c && (c.en.length || nowSec() - c.t < 7 * 86400)) return Promise.resolve();
  const q = new URLSearchParams({ action: 'wbsearchentities', search: raw, language: 'zh', uselang: 'zh', type: 'item', limit: '12', format: 'json', origin: '*' });
  const FOOT = /足球|球会|球會|球队|球隊|俱乐部|俱樂部|football|soccer/i;
  return fetch(WD_API + '?' + q).then(r => r.json()).then(r => {
    const ids = ((r && r.search) || []).filter(x => FOOT.test((x.label || '') + ' ' + (x.description || ''))).slice(0, 3).map(x => x.id);
    if (!ids.length) return [];
    const q2 = new URLSearchParams({ action: 'wbgetentities', ids: ids.join('|'), props: 'labels|aliases', languages: 'en', format: 'json', origin: '*' });
    return fetch(WD_API + '?' + q2).then(x => x.json()).then(g => {
      const en = [];
      for (const id of ids){
        const e = g && g.entities && g.entities[id]; if (!e) continue;
        if (e.labels && e.labels.en) en.push(e.labels.en.value);
        for (const x of (e.aliases && e.aliases.en) || []) en.push(x.value);
      }
      return en;
    });
  }).then(en => {
    WDC[k] = MYWD[k] = { t: nowSec(), en: Array.from(new Set(en)).slice(0, 15) };
    LS.set('corner-six-wd', MYWD);
  }).catch(() => {});
}
function teamSim(u, team){
  const a = ALIAS[normName(u)];
  if (a && a.id === team.id) return 1.2;
  const tn = normName(team.name);
  return Math.max.apply(null, [0].concat(nameKeys(u).map(k => sim(k, tn))));
}
function rankFixtures(list, h, a){
  const out = [];
  for (const f of list){
    if (!f || !f.teams || !f.fixture) continue;
    const H = f.teams.home, A = f.teams.away;
    const n = [teamSim(h, H), teamSim(a, A)], w = [teamSim(h, A), teamSim(a, H)];
    const sn = (n[0] + n[1]) / 2, sw = (w[0] + w[1]) / 2 * 0.95;
    const swp = sw > sn, sc = swp ? sw : sn, pair = swp ? w : n;
    if (Math.min(pair[0], pair[1]) >= 0.4 || Math.max(pair[0], pair[1]) >= 0.8) out.push({ f: f, score: sc, lo: Math.min(pair[0], pair[1]), sw: swp });
  }
  return out.sort((x, y) => y.score - x.score);
}
function rankOne(list, u){
  const out = [];
  for (const f of list){
    if (!f || !f.teams || !f.fixture) continue;
    const sh = teamSim(u, f.teams.home), sa = teamSim(u, f.teams.away), sc = Math.max(sh, sa);
    if (sc >= 0.6) out.push({ f: f, score: sc, lo: sc, sw: false, side: sh >= sa ? 'h' : 'a', live: LIVE_ST.indexOf((f.fixture.status || {}).short) >= 0 ? 1 : 0 });
  }
  return out.sort((x, y) => y.score - x.score || y.live - x.live || (x.f.fixture.timestamp || 0) - (y.f.fixture.timestamp || 0));
}
function zhOf(name){
  const k = normName(name);
  for (const x of TEAM_ZH) if (x[1].some(e => normName(e) === k)) return x[0][0];
  for (const x of TEAM_ZH) if (x[1].some(e => sim(normName(e), k) >= 0.9)) return x[0][0];

    let diff = want - have;
    while (diff > 0){ M.ev.push({ t: PER[p][0], p: p, i: i, c: code, b: 1, k: ++seq }); diff--; }
    while (diff < 0){
      let pick = null;
      for (const e of M.ev) if (e.i === i && e.c === code && (p == null || e.p === p) && e.b && (!pick || e.k > pick.k)) pick = e;
      if (!pick) for (const e of M.ev) if (e.i === i && e.c === code && (p == null || e.p === p) && (!pick || e.k > pick.k)) pick = e;
      if (!pick) break;
      M.ev.splice(M.ev.indexOf(pick), 1); diff++;
    }
  };
  const o = d.orig;
  for (const i of [0, 1]){
    adj(i, 'ck', 1, d.c1[i], o.c1[i]);
    if (d.c2) adj(i, 'ck', 2, d.c2[i], o.c2[i]);
    const p = curP();
    adj(i, 'og', p, d.og[i], o.og[i]);
    adj(i, 'rc', p, d.rc[i], o.rc[i]);
    // 比分里不是乌龙的部分：用“其他进球”补
    const otherWant = d.sc[i] - d.og[i], otherHave = o.sc[i] - o.og[i];
    if (otherWant !== otherHave){
      let diff = otherWant - otherHave;
      while (diff > 0){ M.ev.push({ t: PER[p][0], p: p, i: i, c: 'gx', b: 1, k: ++seq }); diff--; }
      while (diff < 0){
        let pick = null;
        for (const code of ['gx', 'sz', 'lz']){ for (const e of M.ev) if (e.i === i && e.c === code && (!pick || e.k > pick.k)) pick = e; if (pick) break; }
        if (!pick) break;
        if (pick.c === 'gx') M.ev.splice(M.ev.indexOf(pick), 1); else pick.c = pick.c[0] + 'p';
        diff++;
      }
    }
  }
  sortEv(M); save();
}
card.addEventListener('input', ev => {
  if (ev.target.id === 'whQ' && sheetKind === 'arch'){ sheetData.q = ev.target.value; const l = $('#whList'); if (l) l.innerHTML = whListHTML(sheetData); return; }
  if (ev.target.id === 'noteIn'){ M.note = ev.target.value.slice(0, 2000); save(); return; }
  if (ev.target.id === 'tpR' && sheetData.tp){ tpSet(sheetData.tp, +ev.target.value); tpShow(sheetData.tp); }
});
sheet.addEventListener('click', ev => { if (ev.target === sheet) closeSheet(); });
$('#runBtn').addEventListener('click', () => {
  if (M.tm.ht){ const dl = kick(2); save(); renderAll(); showToast('下半场开球' + delayNote(dl)); return; }
  if (M.tm.r) pauseClock();
  else { if (!M.tm.b && M.tm.p === 1 && !M.ev.some(e => !e.b)) { const dl = kick(1); showToast('上半场开球，计时开始' + delayNote(dl)); } else startClock(); if (M.st === 2){ M.st = 1; M.stop = null; } }
  save(); renderAll();
});
for (const [id, key] of [['#fH', 'h'], ['#fA', 'a'], ['#fLg', 'lg']]){
  const el = $(id);
  el.addEventListener('input', () => { M[key] = el.value; save(); renderPads(); renderMid(); renderHud(); if (key !== 'lg'){ if (M.api && !M.ev.length){ M.api = null; } scheduleFind(); renderNet(); } });
  el.addEventListener('keydown', e => { if (e.key === 'Enter') el.blur(); });
}
document.addEventListener('keydown', e => { if (e.key === 'Escape' && !sheet.hidden) closeSheet(); });
let wasPhone = isPhone();
window.addEventListener('resize', () => { if (isPhone() !== wasPhone){ wasPhone = isPhone(); closeOvSilently(); setMid(false); renderAll(); } });

if ('serviceWorker' in navigator && window.isSecureContext && location.protocol !== 'file:'){
  let hadCtrl = !!navigator.serviceWorker.controller;

  });
  navigator.serviceWorker.register('./sw.js').then(reg => {

    return navigator.serviceWorker.ready;
  }).then(() => { offline = '离线使用：已准备好，没有网络也能从主屏幕打开。'; }).catch(() => {});
}

window.__six = { get M(){ return M; }, store: () => store, sixOf: sixOf, projection: projection, parts: parts, tally: tally, minsOf: minsOf, fullHalf: fullHalf, cornerSrc: cornerSrc, xcOf: xcOf };
